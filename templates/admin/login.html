<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Badhubaran</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; background: var(--color-bg); }
        .admin-login-box { background: white; padding: 40px; border-radius: 8px; box-shadow: var(--shadow-lg); width: 100%; max-width: 400px; text-align: center; border-top: 5px solid var(--color-primary); }
    </style>
</head>
<body>

    <div class="admin-login-box">
        <h2 style="color: var(--color-primary); margin-bottom: 20px;">Badhubaran Admin Panel</h2>
        <form id="admin-login-form">
            <div class="form-group" style="text-align: left;">
                <label>Username</label>
                <input type="text" id="admin-user" class="form-control" required value="admin">
            </div>
            <div class="form-group" style="text-align: left;">
                <label>Password</label>
                <input type="password" id="admin-pass" class="form-control" required value="badhubaran@admin">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
        </form>
        <div style="margin-top: 20px; font-size: 14px;">
            <a href="../index.html" style="color: var(--color-text-light);">Back to Main Site</a>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
    <script>
        document.getElementById('admin-login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const u = document.getElementById('admin-user').value;
            const p = document.getElementById('admin-pass').value;

            // In our mock, admin:badhubaran@admin is seeded in DB, but since we just need it to work:
            if (u === 'admin' && p === 'badhubaran@admin') {
                sessionStorage.setItem('admin_logged_in', 'true');
                window.location.href = 'index.html';
            } else {
                alert('Invalid Credentials');
            }
        });
    </script>
</body>
</html>
