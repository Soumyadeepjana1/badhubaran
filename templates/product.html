<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>পণ্য - বধূবরণ</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <style>
        .product-detail-container { display: flex; gap: 50px; margin-top: 40px; margin-bottom: 60px; background: var(--color-white); padding: 40px; border-radius: 8px; box-shadow: var(--shadow-sm);}
        .product-gallery { flex: 1; }
        .main-image { width: 100%; border-radius: 8px; object-fit: cover; border: 1px solid #eee; }
        .product-details { flex: 1; }
        .pd-title { font-size: 32px; color: var(--color-primary-dark); margin-bottom: 5px; }
        .pd-title-en { font-size: 18px; color: var(--color-text-light); margin-bottom: 20px; font-family: var(--font-heading); }
        .pd-price-row { display: flex; align-items: baseline; gap: 15px; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 20px;}
        .pd-price { font-size: 36px; font-weight: bold; color: var(--color-primary); }
        .pd-mrp { font-size: 20px; text-decoration: line-through; color: var(--color-text-light); }
        .pd-desc { font-size: 16px; margin-bottom: 30px; line-height: 1.8; color: var(--color-text-main); }
        .pd-sig { background: var(--color-bg); padding: 15px; border-left: 4px solid var(--color-secondary); margin-bottom: 30px; font-style: italic;}
        .qty-selector { display: flex; align-items: center; gap: 15px; margin-bottom: 30px; }
        .qty-btn { width: 40px; height: 40px; border: 1px solid #ddd; background: var(--color-white); font-size: 20px; cursor: pointer; border-radius: 4px;}
        .qty-input { width: 60px; height: 40px; text-align: center; border: 1px solid #ddd; border-radius: 4px; font-size: 18px;}
        .action-buttons { display: flex; gap: 20px; }
        .action-buttons .btn { flex: 1; padding: 15px; font-size: 18px; }
    </style>
</head>
<body>
    <header>
        <div class="container navbar">
            <a href="index.html" class="logo-text">বধূবরণ</a>
            <div class="nav-actions">
                <a href="products.html" class="nav-icon" style="font-size:16px; font-weight:bold;">দোকান (Shop)</a>
                <a href="wishlist.html" class="nav-icon"><i class="ph ph-heart"></i></a>
                <a href="cart.html" class="nav-icon">
                    <i class="ph ph-shopping-cart"></i><span class="badge" id="cart-badge">0</span>
                </a>
            </div>
        </div>
    </header>

    <div class="container">
        <div id="product-root">
            <p style="text-align:center; padding: 50px;">লোড হচ্ছে...</p>
        </div>
    </div>

    <script src="/static/js/db.js"></script>
    <script src="/static/js/app.js"></script>
    <script>
        let currentProduct = null;
        let qty = 1;

        document.addEventListener('DOMContentLoaded', async () => {
            await window.DB.initDB();
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            
            if (id) {
                currentProduct = window.DB.getProductById(id);
                renderProduct();
            } else {
                document.getElementById('product-root').innerHTML = '<p style="text-align:center; padding: 50px;">পণ্য পাওয়া যায়নি।</p>';
            }
        });

        function changeQty(delta) {
            qty += delta;
            if (qty < 1) qty = 1;
            document.getElementById('qty-input').value = qty;
        }

        function handleAdd() {
            App.addToCart({
                id: currentProduct.id, 
                name_bn: currentProduct.name_bn, 
                price: currentProduct.price, 
                image: currentProduct.image_url
            }, qty);
        }

        function renderProduct() {
            const root = document.getElementById('product-root');
            if(!currentProduct) {
                root.innerHTML = '<p style="text-align:center; padding: 50px;">পণ্য পাওয়া যায়নি।</p>';
                return;
            }
            const p = currentProduct;
            root.innerHTML = `
                <div class="product-detail-container">
                    <div class="product-gallery">
                        <img src="${p.image_url}" class="main-image">
                    </div>
                    <div class="product-details">
                        <h1 class="pd-title playfair">${p.name_bn}</h1>
                        <div class="pd-title-en">${p.name_en}</div>
                        
                        <div class="pd-price-row">
                            <span class="pd-price">₹${p.price}</span>
                            ${p.mrp > p.price ? `<span class="pd-mrp">₹${p.mrp}</span>` : ''}
                        </div>

                        <div class="pd-desc">
                            <p>${p.description_bn}</p>
                            <p style="color: #666; margin-top: 10px; font-size: 14px;">${p.description_en}</p>
                        </div>

                        ${p.cultural_significance ? `
                            <div class="pd-sig">
                                <strong>সাংস্কৃতিক তাৎপর্য: </strong> ${p.cultural_significance}
                            </div>
                        ` : ''}

                        <div class="qty-selector">
                            <button class="qty-btn" onclick="changeQty(-1)">-</button>
                            <input type="number" id="qty-input" class="qty-input" value="1" readonly>
                            <button class="qty-btn" onclick="changeQty(1)">+</button>
                        </div>

                        <div class="action-buttons">
                            <button class="btn btn-outline" onclick="handleAdd()">কার্টে যোগ করুন</button>
                            <button class="btn btn-primary" onclick="handleAdd(); location.href='cart.html'">এখনই কিনুন</button>
                        </div>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
